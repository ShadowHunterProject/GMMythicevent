#Vfx Solar Explosion
vfx_solar_explosion:
  Type: ARMOR_STAND
  Display: ''
  Faction: SOLAR ELEMENTALS
  Health: 200
  Damage: 0
  DamageModifiers:
  - SUFFOCATION 0
  - FALL 0
  AIGoalSelectors:
  - clear
  AITargetSelectors:
  - clear
  Options:
    Invisible: true
    NoDamageTicks: 10
    MovementSpeed: 0
    KnockbackResistance: 1
    Silent: true
    Despawn: true
    Invincible: true
    Collidable: false
    PreventSunburn: true
    PreventBlockInfection: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventJockeyMounts: true
    MaxCombatDistance: 1
    Gravity: false
  Skills: 
  - cancelevent ~onAttack
  - model{mid=vfx_solar_explosion;n=false;step=1;usm=true;sync=true} @self ~onSpawn
  - model{mid=vfx_solar_explosion;n=false;step=1;usm=true;sync=true} @self ~onLoad
  - skill{s=vfx_solar_explosion_summoned} @self ~onSpawn

