#RankA+Hoanguc
koboldWizard_em:
  Type: illusioner
  Display: "&cPháp Sư Koblod"
  Modules:
    ThreatTable: true
  AITargetSelectors:
    - clear
    - players
    - attacker
    - nearestconditionaltarget{mr=true;ms=true;conditions=[ - hasaura{n=koboldagression_frame} true ]}
  AIGoalSelectors:
    - clear
    - meleeattack
    - lookatplayers
    - randomstroll
    - randomlookaround
    - float
  Health: 1500000
  Damage: 2200
  LevelModifiers:
    Health: 2000
    Damage: 9
  BossBar:
    Enabled: true
    Title: "&c&lPháp Sư Koblod"
    Range: 25
    Color: RED
    Style: SEGMENTED_10
  Faction: Kobold
  DamageModifiers:
    - FIRE 0
    - MAGIC 0.7
    - PROJECTILE 0.45
  #Damage: 11 #This is the BASE damage. Applies for ALL skills Setting it to 12 will DOUBLE damage. Setting it to 3 will REDUCE damage in 50% from the original.
  #KillMessages:
  #- '<target.name> was killed by a Kobold.'
  #- 'A Kobold slashed <target.name>.'
  #- "<target.name> was slain by Kobolds"
  #- "A group of Kobold killed <target.name>."
  Equipment:
    - air:4
    - air:3
    - air:2
    #- imboots_koboldWizard_em:1
    - air:0
    - air:5
  Drops:
    - exp 10-25 1
  Skills:
    - message{m="<caster.display> &7đã bị tiêu diệt bởi &c<trigger.name>&c!"} ~onDeath 1 @Server
    - message{m="<caster.display> &7còn sống!! &7(Dungeon Rank A+ Hỏa Ngục) (<caster.l.x{round=2}> <caster.l.y{round=2}> <caster.l.z{round=2}>)"} @Server ~onTimer:1600
    #- message{m="Hitrec <caster.var.hitrec> STACKS"} @PlayersNearOrigin{r=75} ~onDamaged 0 #DEBUGMESSAGE
    #====== MODEL ASSIGNEMENT =============
    - model{m=em_kobold_wizard;n=false;damagetint=false;sync=true} @self ~onSpawn 1
    - model{m=em_kobold_wizard;n=false;damagetint=false;sync=true} @self ~onLoad 1
    - setlevel{a=set;l=0} ~onSpawn
    - setvariable{var=caster.skillxd;value="none";t=string} @Self ~onSpawn
    - skill{s=koboldWizard_em_hp_check} @Self ~onSpawn
    - setvariable{var=caster.eichpee;value="<caster.mhp>";t=integer} @Self ~onSpawn
    - DefaultState{type=WALK;state=walk_combat;li=3;lo=2} @self ~onEnterCombat
    - DefaultState{type=IDLE;state=idle_combat;li=3;lo=2} @self ~onEnterCombat
    - DefaultState{type=WALK;state=walk;li=3;lo=2} @self ~onDropCombat
    - DefaultState{type=IDLE;state=idle;li=3;lo=2} @self ~onDropCombat

    - potion{type=JUMP;duration=999999;lvl=0;p=true} @Self ~OnSpawn
    #============ DISGUISE PROTOCOL =================
    - setvariable{var=caster.skintone;value="0";t=integer} @Self ~onSpawn
    - submodel{mid=em_kobold_wizard;partid=right_forearm;subpartid=right_forearm1b;remove=true;sync=true} @self ~onSpawn
    - submodel{mid=em_kobold_wizard;partid=left_forearm;subpartid=stages;remove=true;sync=true} @self ~onSpawn

    - submodel{mid=em_kobold_wizard;partid=right_forearm;subpartid=right_forearm1b;remove=true;sync=true} @self ~onLoad
    - submodel{mid=em_kobold_wizard;partid=left_forearm;subpartid=stages;remove=true;sync=true} @self ~onLoad

    #============ ATTACK =================
    - summon{type=vfx_solar_strike;amount=1;r=2} @target ~onTimer:60 0.6 ?incombat
    - summon{type=vfx_solar_explosion;amount=1;r=2} @targetlocation ~onTimer:100 0.5 ?incombat
    - summon{type=vfx_solar_mine;amount=1;r=2} @targetlocation ~onTimer:140 0.5 ?incombat
    - summon{type=vfx_solar_fire;amount=1;r=2} @targetlocation ~onTimer:180 0.5 ?incombat

    - skill{s=koboldWizard_em_meleetrigger} @Trigger ~onSignal:DEBUG_TEST 1
    - CancelEvent{sync=true} @self ~onAttack 1 #CANCEL ATTACKS
    - CancelEvent{sync=true} @self ~onShoot 1 #CANCEL ATTACKS

    - skill{s=[
      - skill{s=koboldWizard_em_meleetrigger;sync=false} @LivingInCone{a=160.0;r=4;rot=0.0;ignore=samefaction}
      - skill{s=koboldWizard_em_meleetrigger;sync=false} @LivingInCone{a=200.0;r=1;rot=0.0;ignore=samefaction}]} ~onTimer:14 0.8 ?incombat
    - skill{s=[
      - skill{s=koboldWizard_em_meleetrigger2;sync=false} @LivingInCone{a=160.0;r=5.5;rot=0.0;ignore=samefaction}
      - skill{s=koboldWizard_em_meleetrigger2;sync=false} @LivingInCone{a=200.0;r=1;rot=0.0;ignore=samefaction}]} ~onTimer:9 0.9 ?incombat

    - skill{s=koboldWizard_em_surroundtrigger;sync=false} @EIR{r=6;ignore=samefaction} ~onTimer:15 0.6 <70% ?incombat
    - skill{s=koboldWizard_em_idlesounds_trigger;sync=false} ~onTimer:32 0.3 ?incombat

    - skill{s=koboldWizard_em_meleetrigger;sync=false} @LivingInCone{a=160.0;r=4.5;rot=0.0;ignore=samefaction} ~onAttack
    - setvariable{var=caster.combor;value="0";t=integer} @Self ~onSpawn
    - setvariable{var=caster.comboa;value="0";t=integer} @Self ~onSpawn

    - setstance{stance=normal} @self ~onSpawn
    - skill{s=hurt1koboldWizard_em} @self ~onDamaged 0.92 #Hurtmechanic
    - skill{s=Kobold_em_aggressionaura_assign} @Trigger ~onDamaged 1 # AGRESSION MODULE -> Will mark the trigger to be aggroed (Or feared) by all Kobolds
    - setvariable{var=caster.vulnerable;value="0";t=integer} @Self ~onSpawn
    - solo_velocity{m=set;x=0;y=0;z=0} @self ~onDamaged
    - setspeed{speed=1.3;type=walking} @self ~onEnterCombat
    - setspeed{speed=0.7;type=walking} @self ~onDropCombat
    #================ RIP IN PEPSI PROTOCOL

    - sound{s=entity.evoker.death;p=<random.float.1to1.3>;v=1.5} @selflocation ~onDeath

    - lockmodel{l=false;delay=0;sync=true} @Self ~onDeath
    - effect:particles{particle=cloud;amount=150;hS=1.1;vS=0.55;speed=0;size=4.5;repeat=0;repeatinterval=1;sideOffset=0;delay=60} @ModelPart{m=em_kobold_wizard;p=hip;offset=GLOBAL;y=0.2} ~onDeath
    - effect:particles{particle=cloud;amount=60;hS=0.6;vS=0.2;speed=0;size=4.5;repeat=0;repeatinterval=1;sideOffset=0;delay=60} @ModelPart{m=em_kobold_wizard;p=head;offset=GLOBAL;y=0.2} ~onDeath

  Options:
    Despawn: false
    Silent: true
    AlwaysShowName: false
    MovementSpeed: 0.32
    Interactable: true
    PreventOtherDrops: true
    KnockbackResistance: 0.9
    FollowRange: 24

