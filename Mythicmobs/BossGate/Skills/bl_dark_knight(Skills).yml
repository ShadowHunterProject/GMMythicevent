  - chance{c=0.5}
  - moving true
  - inblock{b=WATER,LAVA} false
  - offgcd
  Skills:
  - randomskill{s=bl_dark_knight_step1,bl_dark_knight_step2}
  - sound{s=bl_dark_knight.step;v=3;p=1} @self

