

bl_dark_knight_spawn:
  Skills:
  - defaultstate{t=idle;s=not_active} @self 
  - lockmodel{l=true;delay=2} @self
  - setspeed{s=0} @self 
  - addtag{t=bl_dark_knight_not_active} @self
  - BodyClamp{mh=25;rde=0;rdu=0} @self

bl_dark_knight_death:
  Skills:
  - sound{s=bl_dark_knight.step;v=3;p=0.8;delay=20} @self
  - sound{s=bl_dark_knight.hurt_first;v=3;p=0.8;delay=30} @self
  - sound{s=bl_dark_knight.wind_first;v=3;p=0.6;delay=38} @self
  - sound{s=bl_dark_knight.wind_second;v=3;p=0.6;delay=42} @self
  - sound{s=bl_dark_knight.step;v=3;p=0.6;delay=48} @self


bl_dark_knight_active:
  Cooldown: 10
  Conditions:
  - targetwithin{d=20} true
  - hastag{t=bl_dark_knight_active} false
  Skills:
  - gcd{ticks=39} @self
  - setspeed{s=0} @self
  - state{s=active} @self
  - sound{s=bl_dark_knight.step;v=3;p=0.7;delay=4} @self
  - sound{s=bl_dark_knight.wind_second;v=3;p=0.7;delay=6} @self
  - lockmodel{l=false;delay=30} @self 
  - defaultstate{t=idle;s=idle} @self
  - addtag{t=bl_dark_knight_active} @self
  - delay 39
  - removetag{t=bl_dark_knight_not_active} @self
  - setspeed{s=1} @self


bl_dark_knight_skills:
  Skills:
  - randomskill{s=bl_dark_knight_sweep,bl_dark_knight_chop,bl_dark_knight_pierce,bl_dark_knight_spin,bl_dark_knight_u-turn} @target

bl_dark_knight_step:
