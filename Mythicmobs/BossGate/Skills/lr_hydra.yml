### SPAWN ###

LR_HYDRA_spawn:
  Skills:
  - gcd{ticks=80}
  - setspeed{s=1} @self
  - bodyrotation{rde=0;rdu=200} @self
  - skill{s=LR_HYDRA_bossbar_set} @self
  - partvis{mid=piglin_mech;pid=fire;v=false} @self
  - brightness{b=15;s=15;pid=fire} @self

## BOSSBAR ##

LR_HYDRA_bossbar_set:
  Skills:
  - barCreate{
    name="LR_HYDRA";
    display="<caster.name>";
    value=1.0;color=PURPLE;
    style=SEGMENTED_6
    } @self

LR_HYDRA_bossbar_damage:
  Conditions:
  - damagecause{c=FIRE_TICK} false
  Skills:
  - brightness{b=15;s=15} @self
  - barSet{name="LR_HYDRA";display="<caster.name>";value=<caster.hp>/<caster.mhp>;color=WHITE;style=SOLID} @self
  - delay 2
  - brightness{b=-1;s=-1} @self
  - barSet{name="LR_HYDRA";display="<caster.name>";value=<caster.hp>/<caster.mhp>;color=PURPLE;style=SOLID} @self
  - delay 2
  - barSet{name="LR_HYDRA";display="<caster.name>";value=<caster.hp>/<caster.mhp>;color=WHITE;style=SOLID} @self
  - delay 2
  - barSet{name="LR_HYDRA";display="<caster.name>";value=<caster.hp>/<caster.mhp>;color=PURPLE;style=SOLID} @self


### SLOW ROTATION ###

LR_HYDRA_stop_turn:
  Conditions:
  - varequals{var=caster.turning;v=true} false
  TargetConditions:
  - fieldofview{angle=90} true
  Skills:
  - state{s=turn_right;p=7;r=true} @self
  - state{s=turn_left;p=7;r=true} @self
  

LR_HYDRA_turn_right:
  Conditions: 
  - varequals{var=caster.leap;val=true} false
  - offgcd true
  TargetConditions:
  - fieldofview{angle=140;r=270} true
  Skills:
  - state{s=turn_right;cd=3;p=7;li=5;lo=5} @self
  - setvar{var=caster.turning;val=true;type=STRING;d=20} @self
  - setrotation{relative=true;yaw=1} @self

LR_HYDRA_turn_left:
  Conditions: 
  - varequals{var=caster.leap;val=true} false
  - offgcd true
  TargetConditions:
  - fieldofview{angle=140;r=90} true
  Skills:
  - state{s=turn_left;cd=3;p=7;li=5;lo=5} @self
  - setvar{var=caster.turning;val=true;type=STRING;d=20} @self
  - setrotation{relative=true;yaw=-1} @self


