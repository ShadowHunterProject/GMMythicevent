LR_HYDRA_spot_player:
  Cooldown: 10
  Skills:
  - state{s=spot_player;p=2;delay=10} @self
  - sound{s=littleroom_hydra:hydra.spotted_roar;v=10;sc=HOSTILE;pitch=<random.float.0.9to1.1>} @self
  - setvar{var=caster.roar;val=true;type=STRING;duration=100} @self
  - gcd{ticks=80} @self


LR_HYDRA_blood_fx_melee:
  Skills:
  - e:p{p=block;m=magenta_concrete;a=10;hs=.075;vs=.075} @forward{f=0.625;y=0.8}

LR_HYDRA_blood_fx_projectile:
  Skills:
  - raytrace{
      entitySkill=[
        - e:p{p=block;m=magenta_concrete;a=10;hs=.075;vs=.075}
      ]} @targetlocation
  

