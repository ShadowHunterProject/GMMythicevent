summonaxe:
  Conditions:
    - offgcd true
    - targetinlineofsight true
    - incombat true
    - playernotwithin{d=3} true
    - playerwithin{d=20} true
    - targetinlineofsight true
  Skills:
    - gcd{ticks=30}
    - setspeed{t=walk;s=0} @self
