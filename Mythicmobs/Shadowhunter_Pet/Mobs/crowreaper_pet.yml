crowaxe_Pet:
  Tags:
  - skill_model
  Type: ARMOR_STAND
  Display: 'crowaxe_Pet'
  Health: 1000
  Skills:
  - cancelEvent{forcesync=true} @self ~onAttack
  - addtag{t=skill_model} @self ~onSpawn
  - aura{auraName=PetImmunity;duration=60} @Owner ~onTimer:20
  - model{mid=crowaxe;n=false;h=true} @self ~onSpawn
  - setNoDamageTicks{ticks=500} @self ~onSpawn
  - lockmodel{l=true} @self ~onSpawn
  - skill{s=axeactivate_Pet;sync=true} @self ~onSpawn

  Options:
    Marker: true
    Invisible: true
    Gravity: false
    HasArms: false
    Small: true
    NoDamageTicks: 10
    PreventOtherDrops: true
    Collidable: false
    Persistent: false
    Silent: true   
    KnockbackResistance: 1
    
crowswarm_Pet:
  Tags:
  - skill_model
  Type: chicken
  Display: 'crowswarm_Pet'
  Health: 1000
  AiTargetSelectors:
  - lookatplayers{r=12}
  Skills:
  - cancelEvent{forcesync=true} @self ~onAttack
  - addtag{t=skill_model} @self ~onSpawn
  - aura{auraName=PetImmunity;duration=60} @Owner ~onTimer:20
  - model{mid=crowswarm;n=false;h=true} @self ~onSpawn
  - look{immediately=true} @NearestPlayer{r=10} ~onSpawn
  - setNoDamageTicks{ticks=500} @self ~onSpawn
  - skill{s=crowswarmaction_Pet;sync=true} @self ~onSpawn

  Options:
    MovementSpeed: 0.05
    MaxCombatDistance: 20 
    PreventOtherDrops: true
    Collidable: false
    Persistent: false
    KnockbackResistance: 1
    PreventVanillaDamage: true
    Silent: true   

