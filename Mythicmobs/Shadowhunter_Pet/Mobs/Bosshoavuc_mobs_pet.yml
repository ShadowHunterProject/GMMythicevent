VFX_AwakenedMage_Fireball_Explosion_Pet:
  Type: block_display
  DisplayOptions:
    Block: AIR
    Billboard: FIXED
  Options:
    Invincible: true
    Collidable: false
    KnockbackResistance: 1
  Skills:
  - cancelEvent{forcesync=true} @self ~onAttack
  - aura{auraName=PetImmunity;duration=60} @Owner ~onTimer:20
  - remove{delay=20} @self ~onSpawn
  - model{usestatemachine=true;mid=fireball_explosion_1;lockpitch=true} @self ~onSpawn
  - brightness{b=15;s=15} @self ~onSpawn
  - BodyRotation{playermode=false;stable=0;rdelay=0;rduration=0} @self ~onSpawn
  - state{s=animation;speed=1} @self ~onSpawn

  - aura{sync=true;delay=1;d=8;i=1;
    os=[
    - setvariable{var=caster.iteration;val=1;type=INTEGER}
      ];
      ot=[
    - setvariable{var=caster.iteration;val="<caster.var.iteration>+1"}
    - remapmodel{m=fireball_explosion_1;n=fireball_explosion_<caster.var.iteration>}
      ];
      oe=[ - remove{delay=1} @self ]} @self ~onSpawn
