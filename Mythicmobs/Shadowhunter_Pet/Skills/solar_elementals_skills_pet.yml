# --- VFX SUMMONS (Pet Version) ---

vfx_solar_fire_summoned_pet:
  Skills:
    - state{model=vfx_solar_fire;state=spawn} @self
    - lockmodel @self
    - sound{s=tugkandeman.solar_fire;v=3;p=1} @self
    - delay 6
    - aura{auraName=vfxSolarFireD;duration=130;oT=vfx_solar_fire_summoned_damage_pet;i=20} @self
    - delay 150
    - remove @self

vfx_solar_fire_summoned_damage_pet:
  Skills:
    - sound{s=block.fire.ambient;v=2;p=1} @self
    - totem{md=2;oH=vfx_solar_fire_hit_pet;hnp=true;hp=true;hR=3.5;vR=3.5;i=1;drawhitbox=false} @selfLocation

vfx_solar_fire_hit_pet:
  Skills:
    - damage{a=550;t=SKILL;pkb=false;pi=true} @target{ignore=players;ignore=owner}
    - damage{a=560;t=SKILL;pkb=false;pi=true} @target{target=players;ignore=owner}

vfx_solar_snare_summoned_pet:
  Skills:
    - state{model=vfx_solar_snare;state=spawn} @self
    - lockmodel @self
    - sound{s=tugkandeman.solar_snare;v=3;p=1} @self
    - delay 17
    - damage{a=330;t=SKILL;pkb=false;pi=true} @LivingInRadius{r=5;ignore=samefaction;ignore=players;ignore=owner}
    - damage{a=340;t=SKILL;pkb=false;pi=true} @LivingInRadius{r=5;ignore=samefaction;target=players;ignore=owner}
    - potion{type=SLOW;duration=60;l=255;p=false} @LivingInRadius{r=5;ignore=samefaction}
    - potion{type=JUMP;duration=60;l=155;p=false} @LivingInRadius{r=5;ignore=samefaction}
    - aura{auraName=vfxSolarSnarePull;duration=60;oT=vfx_solar_snare_pull_pet;interval=5} @self
