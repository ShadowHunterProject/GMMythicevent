#Basic Attack 1
apocalypse_basic_attack_Pet:
  TargetConditions:
  - isowner false
  Cooldown: 1.5
  Conditions:
  - incombat true
  - hasaura{n=basic1} false
  - hasaura{n=basic2} false
  - hasaura{n=blackbox} false
  - hasaura{n=blackH} false
  - hasaura{n=bongtoi2} false
  Skills:
  - delay 1
  - CancelEvent @self
  - setspeed{speed=0;type=WALKING} @self
  - aura{auraName=basic1;duration=29} @self
  - state{model=apocalypse_type_a;state=basic_attack} @self
  - delay 7
  - lockmodel @self
  - aura{auraName=basic1D;duration=4;oT=basic1_damage_Pet} @self
  - sound{s=entity.player.attack.sweep;v=3;p=1} @self
  - sound{s=entity.zombie.attack_iron_door;p=1.1;v=0.8;r=12} @self
  - sound{s=entity.evoker.cast_spell;p=0.5;v=1;r=12} @self
  - sound{s=block.anvil.hit;p=2.0;v=1.2;r=12} @self
  - sound{s=item.trident.throw;p=0.8;v=1.1;r=12} @self
  - delay 22
  - lockmodel{l=false;sync=true} @self
  - setspeed{speed=1;type=WALKING} @self

basic1_damage_Pet:
  TargetConditions:
  - isowner false
  Skills:
  - totem{md=2;oH=[ - skill{s=apoc_deal_damage_Pet} ];hnp=true;hp=true;hR=4.5;vR=4.5;i=1;drawhitbox=false} @ModelPart{mid=apocalypse_type_a;pid=arm_sword}

