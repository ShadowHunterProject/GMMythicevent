# Scorpion King #  
Poison_Puddle:
  Type: ARMOR_STAND
  Options:
    Marker: false
    Small: false
    Invisible: true
    Interactable: false
    Collidable: false
    Invincible: true
    KnockbackResistance: 1
    Gravity: false
  Skills:
  - model{mid=poison_puddle;n=false;step=1;scale=1.3} @self ~onSpawn
  #- potion{type=POISON;duration=80;level=1;hasParticles=false} @PIR{r=4} ~onTimer:20
  - skill{s=Poison_Puddle_LOOP} ~onTimer:40
  - effect:sound{s=scorpion_sounds:samus.scorpion_poison;volume=0.9;pitch=1} @self ~onTimer:40
  - remove{delay=160} @self ~onSpawn

abyssal_puddle:
  Type: ARMOR_STAND
  Options:
    Marker: false
    Small: false
    Invisible: true
    Interactable: false
    Collidable: false
    Invincible: true
    KnockbackResistance: 1
    Gravity: false
  Skills:
  # Gn model + chy animation spawn + kha model
  - model{mid=abyssal_puddle;n=false;step=1;usm=true;scale=3.0} @self ~onSpawn
  - delay 4 ~onSpawn
  - lockmodel @self ~onSpawn

  # m thanh lc xut hin (trnh spam kiu timer)
  - effect:sound{s=scorpion_sounds:samus.scorpion_poison;volume=0.9;pitch=1} @self ~onSpawn
  
  # T xo sau 160 ticks
  - remove{delay=160} @self ~onSpawn
