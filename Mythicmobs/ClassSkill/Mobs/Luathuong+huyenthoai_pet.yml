lostassetsanime_firekatana_lc1_Pet:
  Tags:
  - skill_model
  Type: ITEM_DISPLAY
  Options:
    KnockbackResistance: 1
  Skills:
  - cancelevent ~onAttack
  - addtag{t=skill_model} @self ~onSpawn
  - aura{auraName=PetImmunity;duration=60} @Owner ~onTimer:20
  - model{mid=lostassetsanime_firekatana_slash;usm=true;lockpitch=true;hitboxscale=0;scale=1.3} @self ~onSpawn
  - brightness{mid=lostassetsanime_firekatana_slash;b=15;s=15} @self ~onSpawn
  - state{s=slash1} @self ~onSpawn
  - remove{delay=20} @self ~onSpawn
