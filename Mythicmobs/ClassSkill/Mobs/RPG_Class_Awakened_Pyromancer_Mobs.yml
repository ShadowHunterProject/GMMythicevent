VFX_HELLFIRE_OVERBLAST:
  Type: block_display
  DisplayOptions:
    Block: AIR
    Billboard: FIXED
  Options:
    Invincible: true
    Collidable: false
    KnockbackResistance: 1
  Skills:
  - model{usestatemachine=true;mid=hellfire_overblast_vfx;lockpitch=false} @self ~onSpawn
  - brightness{b=15;s=15} @self ~onSpawn
  - BodyRotation{playermode=false;stable=0;rdelay=0;rduration=0} @self ~onSpawn
