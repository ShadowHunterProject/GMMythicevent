
VFX_PYRO_METEOR:
  Type: block_display
  DisplayOptions:
    Block: AIR
    Billboard: FIXED
  Options:
    Invincible: true
    Collidable: false
    KnockbackResistance: 1
  Skills:
  - model{usestatemachine=true;mid=meteor_vfx;lockpitch=true;scale=1.7} @self ~onSpawn
  - brightness{b=15;s=15} @self ~onSpawn
  - BodyRotation{playermode=false;stable=0;rdelay=0;rduration=0} @self ~onSpawn
  - state{s=animation;speed=1} @self ~onSpawn
  
