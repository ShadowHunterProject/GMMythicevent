# Phoenix Totem #

VFX_Phoenix_Totem:
  Type: block_display
  DisplayOptions:
    Block: AIR
    Billboard: FIXED
  Options:
    Invincible: true
    Collidable: false
  Skills:
  - model{usestatemachine=true;mid=vfx_phoenix_totem} @self ~onSpawn
  - brightness{mid=vfx_phoenix_totem;b=15;s=15} @self ~onSpawn
  - BodyRotation{playermode=true;stable=0;rdelay=0;rduration=0} @self ~onSpawn
  - state{s=spawn} @self ~onSpawn
  - state{s=despawn;delay=180} @self ~onSpawn
  - remove{delay=200} @self ~onSpawn
  - state{s=hit} @self ~onSignal:TOTEM
  - state{s=hit} @self ~onSignal:ENDTOT





