# Small Explosion #

VFX_Phoenix_Explosion_SMALL:
  Type: block_display
  DisplayOptions:
    Block: AIR
    Billboard: FIXED
  Options:
    Invincible: true
    Collidable: false
  Skills:
  - aura{d=24;i=2;
    os=[
    - setvariable{var=caster.iteration;val=1}
    - model{usestatemachine=true;mid=vfx_phoenix_explosion_1;lockpitch=true;scale=0.525}
    - BodyRotation{playermode=false;stable=0;rdelay=0;rduration=0}
    - brightness{mid=vfx_phoenix_explosion_1;b=15;s=15}
    - skill{s=VFX_Phoenix_Explosion_RAN}
    ];
    ot=[
    - setvariable{var=caster.iteration;val="<caster.var.iteration|1>+1"}
    - changepart{m=vfx_phoenix_explosion_1;nm=vfx_phoenix_explosion_<caster.var.iteration|1>;p=body;np=body}
    ];
    oe=[ - remove @self ]} @self ~onSpawn

  - effect:particles{p=smoke;amount=10;hS=0.3;vS=0.3;y=0;size=1;speed=0.05;delay=10} @modelpart{p=body} ~onSpawn
  - effect:particles{p=campfire_cosy_smoke;amount=3;hS=0.5;vS=0.5;y=0;size=1;speed=0.1;delay=10} @modelpart{p=body} ~onSpawn
  - effect:particles{p=lava;amount=5;hS=0.3;vS=0.3;y=0;size=1;speed=0.1;delay=10} @modelpart{p=body} ~onSpawn
  
