Pyro_Combo:
  Conditions:
  - hasAura{aura=CASTING} false
  Skills:
  - aura{auraName=CASTING;duration=40} @self
  - Aura{auraName=HEAT;duration=600;maxStacks=3;delay=1} @self
  - skill{s=Pyro_Combo_SEQUENCE}

Pyro_Combo_SEQUENCE:
  Skills:
  - skill{s=Pyro_Combo_SHOOT}
  - sound{s=entity.ghast.shoot;volume=1;pitch=<random.float.0.6to0.7>;delay=1} @self
  - delay 20
  - skill{s=Pyro_Combo_SHOOT}
  - sound{s=entity.ghast.shoot;volume=1;pitch=<random.float.0.6to0.7>} @self
  - delay 10
  - skill{s=Pyro_Combo_SHOOT}
  - sound{s=entity.ghast.shoot;volume=1;pitch=<random.float.0.6to0.7>} @self

Pyro_Combo_SHOOT:
  Skills:
  - skill{s=Pyro_Combo_SHOOT_PRO;origin=@SelfEyeLocation{fo=-0.5;yo=-0.2}} @forward{f=11;y=-4;uel=true;lockpitch=true}

Pyro_Combo_SHOOT_PRO:
  Skills:
  - projectile{bmd=true;bulletType=MOB;mob=VFX_PYRO_METEOR;ohb=Pyro_Combo_DAMAGE_D;oS=Pyro_Combo_SHOOT_PRO_VEL;v=2;i=1;hR=2;vR=2;mr=15;hnp=true;hO=0;sE=false;sB=false;hs=false;hfs=0;sfo=0;syo=4;tyo=0;sso=0;fo=true;hitConditions=[- isLiving true];byo=0;drawhitbox=false;ham=true}

Pyro_Combo_SHOOT_PRO_VEL:
  Skills:
  - delay 9
  - modifyProjectile{trait=VELOCITY;action=SET;value=28}

Pyro_Combo_DAMAGE_D:
  Cooldown: 0.001
  Skills:
  - summon{type=VFX_PYRO_METEOR_RUBBLES;amount=1;radius=0;yRadius=0;onSurface=true} @origin{y=0.27}
  - summon{type=VFX_LAVA_RUPTURE;amount=1;radius=0;yRadius=0;onSurface=true} @origin{y=0.27}
  - particles{p=Campfire_Cosy_Smoke;amount=7;hS=0.8;vS=0.1;y=0;size=1;speed=0} @origin{y=0.27}
  - sound{s=entity.dragon_fireball.explode;volume=2;pitch=<random.float.0.9to1>} @self
  - skill{s=Pyro_Combo_DAMAGE} @EntitiesNearOrigin{r=7;sort=NEAREST}

Pyro_Combo_DAMAGE:
  TargetConditions:
  - solo_is_my_summon false
  - entitytype{t=ARMOR_STAND} false
  - solo_can_target{interaction=OFFENSE_ACTION} true
  - isLiving true
  - hasaura{aura=immunedelay} false
  Skills:
  - solo_damage{a="<skill.var.damage>";pkb=true} @Targeted ?!isplayer
  - solo_damage{a="<skill.var.damage>";pkb=true} @Targeted ?isplayer
  - ignite{ticks=60}
  - projectile{targetisorigin=true;bulletType=MOB;mob=VFX_SAMUS_Impact;v=0;i=1;hR=0;vR=0;mr=2;hnp=false;hO=0;sE=false;sB=false;hs=false;hfs=0;sfo=0;syo=1.2;tyo=1.2;sso=0;fo=true;byo=0;ham=true}
  - sound{s=entity.generic.explode;volume=0.8;pitch=<random.float.1.1to1.2>} @self


