  - lunge{velocity=0.6;velocityY=0} @forward{f=13;y=3;lockpitch=true}
  - summon{type=FX_Cetus_Slash4_2;amount=1;radius=0;yRadius=0;onSurface=true} @forward{f=1;y=0.2;sideOffset=0;lockpitch=true}
  # hR/vR: 5 -> 10
