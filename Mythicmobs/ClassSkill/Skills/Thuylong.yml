#----------------------------------skill1------------------------#
Cetus_DragonCharge:
  Skills:
  - potion{type=Speed;duration=150;level=3;hasParticles=false} @self
  - effect:particles{p=end_rod;amount=8;speed=0.01;hS=0.2;vS=1.0} @self
