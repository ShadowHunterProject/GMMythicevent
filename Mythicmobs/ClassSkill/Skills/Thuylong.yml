  - effect:sound{s=entity.ender_dragon.growl;volume=0.6;pitch=1.6} @self
  - effect:sound{s=entity.warden.sonic_boom;volume=1.0;pitch=1.3} @self
  # hR/vR: 5 -> 10
  - totem{md=2;c=1;oH=Cetus_DragonCharge_DAMAGE_D;hnp=true;hp=true;hR=10;vR=10;i=1;repeat=9;repeatinterval=1} @self
  - delay 5
  - effect:sound{s=entity.player.attack.sweep;volume=0.7;pitch=0.6} @self
  - effect:sound{s=item.trident.throw;volume=0.7;pitch=0.8} @self
  - effect:sound{s=ambient.underwater.enter;volume=0.5;pitch=1.6} @self
  - effect:sound{s=ambient.underwater.exit;volume=0.5;pitch=1.7} @self
  # hR/vR: 5 -> 10
  - totem{md=2;c=1;oH=Cetus_Slash_DAMAGE5_D;hnp=true;hp=true;hR=10;vR=10;i=1} @forward{f=1;lockpitch=true}
