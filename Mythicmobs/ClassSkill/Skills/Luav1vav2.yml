  - setprojectiledirection{delay=0} @ProjectileForward{f=3;rot=20}
  - setprojectiledirection{delay=3} @ProjectileForward{f=3;rot=10}
  - setprojectiledirection{delay=6} @ProjectileForward{f=3;rot=0}
  - setprojectiledirection{delay=8} @ProjectileForward{f=3;rot=-10}
  - setprojectiledirection{delay=10} @ProjectileForward{f=3;rot=-20}
  - setprojectiledirection{delay=12} @ProjectileForward{f=3;rot=-30}

Flameburst_Convergence_DAMAGE_D:
  Skills:
  - effect:sound{s=entity.generic.explode;volume=0.6;pitch=<random.float.0.8to1.2>} @origin
  - summon{type=VFX_Phoenix_Impact;amount=1;radius=0;yRadius=0;onSurface=true} @origin
  - solo_damage{a=<skill.var.damage>;cause=ENTITY_ATTACK;pkb=true} @EntitiesNearOrigin{r=3.7;ignore=owner;ignore=caster} ?isplayer{}
  - solo_damage{a=<skill.var.damage>;cause=ENTITY_ATTACK;pkb=true} @EntitiesNearOrigin{r=3.7;ignore=owner;ignore=caster} ?!isplayer{}
