# ========================================== #
# CLASS SKILLS REBUILD FOR FIRE V1 & V2      #
# Removed all basic attack dummy targeters   #
# ========================================== #

# ------------------------------------------ #
# COMMON EFFECTS                             #
# ------------------------------------------ #

Flameborn_BURN:
  Skills:
  - effect:sound{s=entity.player.hurt_on_fire;volume=0.6;pitch=1;repeat=4;repeati=20} @target
  - effect:sound{s=entity.generic.burn;volume=0.5;pitch=1.4;repeat=4;repeati=20} @target
  - solo_damage{a=5;cause=ENTITY_ATTACK;pkb=true;hnp=true;hp=true;repeat=4;repeati=20} @target
  - ignite{ticks=100} @target
  - particles{p=small_flame;amount=10;hS=0.3;vS=0.7;y=1;size=1;speed=0.03;repeat=4;repeati=20} @target

# ------------------------------------------ #
# SKILL 1: Blazing Feathers                  #
# ------------------------------------------ #

Blazing_Feathers:
  Skills:
  - skill{s=Blazing_Feathers_SHOOT;repeat=2;repeatinterval=10}

Blazing_Feathers_SHOOT:
  Skills:
  - summon{type=VFX_Phoenix_Shoot_Impact;amount=1;radius=0;yRadius=0;onSurface=true} @SelfEyeLocation{fo=1.2}
  - effect:sound{s=entity.blaze.shoot;volume=0.6;pitch=<random.float.0.8to1.2>} @self
  - projectile{tickinterpolation=5;bulletType=MOB;mob=VFX_Phoenix_Fireball;onHit=Blazing_Feathers_EXPLOSIVE_DAMAGE;v=23;i=1;hR=0.9;vR=0.9;mr=50;hnp=true;hO=0;sE=true;sB=true;hs=false;hfs=0;syo=1.6;sfo=1.2;fo=true;hitConditions=[- isLiving true];drawhitbox=false;ham=true} @forward{f=12;uel=true}

Blazing_Feathers_EXPLOSIVE_DAMAGE:
  Skills:
  - effect:sound{s=entity.generic.explode;volume=0.6;pitch=<random.float.0.8to1.2>} @origin
  - summon{type=VFX_Phoenix_Impact;amount=1;radius=0;yRadius=0;onSurface=true} @origin
  - solo_damage{a=<skill.var.damage>;cause=ENTITY_ATTACK;pkb=true} @EntitiesNearOrigin{r=4.5;ignore=owner;ignore=caster} ?isplayer{}
  - solo_damage{a=<skill.var.damage>;cause=ENTITY_ATTACK;pkb=true} @EntitiesNearOrigin{r=4.5;ignore=owner;ignore=caster} ?!isplayer{}
  - skill{s=Flameborn_BURN} @EntitiesNearOrigin{r=4.5;ignore=caster;ignore=owner}
  # Big Explosion instantly
  - skill{s=Blazing_Feathers_BIG_EXPLOSION} @origin

Blazing_Feathers_BIG_EXPLOSION:
  Skills:
  - effect:sound{s=entity.dragon_fireball.explode;volume=0.8;pitch=1;repeat=2;repeati=3} @origin
  - summon{type=VFX_Phoenix_Explosion_SMALL;amount=1;radius=0;yRadius=0;onSurface=true} @origin
  - solo_damage{a="<skill.var.damage> * 1.5";cause=ENTITY_ATTACK;pkb=true} @EntitiesNearOrigin{r=4;ignore=owner;ignore=caster} ?isplayer{}
  - solo_damage{a="<skill.var.damage> * 1.5";cause=ENTITY_ATTACK;pkb=true} @EntitiesNearOrigin{r=4;ignore=owner;ignore=caster} ?!isplayer{}

# ------------------------------------------ #
# SKILL 2: Ashdance                          #
# ------------------------------------------ #

Ashdance:
  Skills:
  - effect:sound{s=entity.ender_dragon.flap;volume=0.6;pitch=1.4} @self
  - effect:sound{s=entity.blaze.shoot;volume=0.6;pitch=0.7} @self
  - lunge{velocity=1;velocityY=-0.1;repeat=5;repeati=1} @Forward{f=-6;y=-1;lockpitch=true}
  - summon{type=VFX_Phoenix_Dash;amount=1;radius=0;yRadius=0;onSurface=true} @SelfLocation{y=1.2}
  - delay 7
  - skill{s=Ashdance_SHOOT_MISSILES} @EntitiesNearOrigin{r=20;limit=1;sort=NEAREST;conditions=[- isLiving true]}
  - delay 5
  - effect:sound{s=block.fire.extinguish;volume=0.5;pitch=0.7} @self

Ashdance_SHOOT_MISSILES:
  Skills:
  - effect:sound{s=entity.blaze.shoot;volume=0.3;pitch=<random.float.1.1to1.4>} @origin
  - missile{oT=Ashdance_Missiles_TICK;onHit=Ashdance_PRO_DAMAGE;in=0.5;v=3;i=1;hR=0.3;vR=0.3;md=80;mr=30;hnp=true;hO=0;vo=0;sso=<random.float.-1to1>;eso=<random.float.-0.25to0.25>;sE=true;sB=true;hs=false;hfs=0;syo=<random.float.-1to1>;tyo=<random.float.0.9to1.7>;fo=true;byo=0;drawhitbox=false;ham=true}
  - skill{s=Ashdance_Missile_Shot;delay=2}
  - skill{s=Ashdance_Missile_Shot;delay=4}
  - skill{s=Ashdance_Missile_Shot;delay=6}
  - skill{s=Ashdance_Missile_Shot;delay=8}
  - skill{s=Ashdance_Missile_Shot;delay=10}

Ashdance_Missile_Shot:
  Skills:
  - effect:sound{s=entity.blaze.shoot;volume=0.3;pitch=<random.float.1.1to1.4>} @origin
  - missile{oT=Ashdance_Missiles_TICK;onHit=Ashdance_PRO_DAMAGE;in=0.5;v=3;i=1;hR=0.3;vR=0.3;md=80;mr=30;hnp=true;hO=0;vo=0;sso=<random.float.-1to1>;eso=<random.float.-0.25to0.25>;sE=true;sB=true;hs=false;hfs=0;syo=<random.float.-1to1>;tyo=<random.float.0.9to1.7>;fo=true;byo=0;drawhitbox=false;ham=true}

Ashdance_Missiles_TICK:
  Skills:
  - modifyProjectile{trait=VELOCITY;action=MULTIPLY;value=1.1}
  - effect:particles{p=dust_color_transition;color1=#ffcd17;color2=#fa2707;amount=1;hS=0;vS=0;y=0;size=0.4;speed=0.01} @origin
  - effect:particles{p=dust_color_transition;color1=#4a0200;color2=#1c0000;amount=1;hS=0;vS=0;y=0;size=0.4;speed=0.01} @origin

Ashdance_PRO_DAMAGE:
  Skills:
  - effect:sound{s=entity.generic.explode;volume=0.6;pitch=<random.float.0.8to1.2>} @origin
  - summon{type=VFX_Phoenix_Impact;amount=1;radius=0;yRadius=0;onSurface=true} @origin
  - solo_damage{a=<skill.var.damage>;cause=ENTITY_ATTACK;pkb=true} @EntitiesNearOrigin{r=4.5;ignore=owner;ignore=caster} ?isplayer{}
  - solo_damage{a=<skill.var.damage>;cause=ENTITY_ATTACK;pkb=true} @EntitiesNearOrigin{r=4.5;ignore=owner;ignore=caster} ?!isplayer{}
  - skill{s=Flameborn_BURN} @EntitiesNearOrigin{r=4.5;ignore=caster;ignore=owner}

# ------------------------------------------ #
# SKILL 3: Flameburst Convergence            #
# ------------------------------------------ #

Flameburst_Convergence:
  Skills:
  - skill{s=Flameburst_Convergence_SHOOT;repeat=2;repeatinterval=10}

Flameburst_Convergence_SHOOT:
  Skills:
  - effect:sound{s=entity.blaze.shoot;volume=0.6;pitch=0.8} @self
