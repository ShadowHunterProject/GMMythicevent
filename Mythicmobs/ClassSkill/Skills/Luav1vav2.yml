  - summon{type=VFX_Phoenix_Shoot_Impact2;amount=1;radius=0;yRadius=0;onSurface=true} @SelfEyeLocation{fo=1.2;rot=30}
  - summon{type=VFX_Phoenix_Shoot_Impact3;amount=1;radius=0;yRadius=0;onSurface=true} @SelfEyeLocation{fo=1.2;rot=-30}
  
  # Middle
  - projectile{tickinterpolation=5;bulletType=MOB;mob=VFX_Phoenix_Feather_NOTRAIL;onHit=Flameburst_Convergence_DAMAGE_D;oE=Flameburst_Convergence_END;v=18;i=1;hR=0.6;vR=0.6;mr=15;hnp=true;hO=0;sE=false;sB=true;hs=false;hfs=0;syo=1.6;sfo=1.2;fo=true;hitConditions=[- isLiving true];drawhitbox=false;ham=true} @forward{f=12;uel=true}
