  - projectile{oS=Flameburst_Convergence_T1;tickinterpolation=5;bulletType=MOB;mob=VFX_Phoenix_Feather_NOTRAIL1;onHit=Flameburst_Convergence_DAMAGE_D;v=20;i=1;hR=0.6;vR=0.6;mr=16;hnp=true;hO=0;sE=false;sB=true;hs=false;hfs=0;syo=1.6;sfo=1.2;sso=-0.7;fo=true;hitConditions=[- isLiving true];drawhitbox=false;ham=true} @forward{f=12;uel=true}
  # Right
  - projectile{oS=Flameburst_Convergence_T2;tickinterpolation=5;bulletType=MOB;mob=VFX_Phoenix_Feather_NOTRAIL2;onHit=Flameburst_Convergence_DAMAGE_D;v=20;i=1;hR=0.6;vR=0.6;mr=16;hnp=true;hO=0;sE=false;sB=true;hs=false;hfs=0;syo=1.6;sfo=1.2;sso=0.7;fo=true;hitConditions=[- isLiving true];drawhitbox=false;ham=true} @forward{f=12;uel=true}

