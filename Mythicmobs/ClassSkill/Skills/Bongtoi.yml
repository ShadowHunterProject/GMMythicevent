    - solo_can_target{interaction=OFFENSE_ACTION} true
  Skills:
    - solo_damage{a="<skill.var.damage>";pkb=true} ?isplayer
    - solo_damage{a="<skill.var.damage>";pkb=true} ?!isplayer
    - potion{type=SLOW;duration=60;level=1;hasParticles=false} @Targeted ?!gm_is_immune
    - potion{type=BLINDNESS;duration=60;level=0;hasParticles=false} @Targeted ?!gm_is_immune
