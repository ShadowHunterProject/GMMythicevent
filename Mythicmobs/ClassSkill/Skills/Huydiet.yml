#===========================================================================skill1==================================================================================#    
## Singularity (Shift + LMB)
PbWS_Singularity_mmocore:
  
  Skills:
  - setvariable{var=skill.shieldFound;value=0} @caster
  
  # Try Shield 1
  - skill{s=[
        - variableadd{var=skill.shieldFound;amount=1} @caster
        - skill{s=PbWS_Orbit_Shield_1_Out}
        
        - delay 170
        - skill{s=PbWS_Orbit_Shield_1_Return_mmocore}
    ]} @self ?varInRange{var=skill.shieldFound;value=<2} ?varEquals{var=caster.pbws_shield_1_availability;value=1}
  
  # Try Shield 4
  - skill{s=[
        - variableadd{var=skill.shieldFound;amount=1} @caster
        - skill{s=PbWS_Orbit_Shield_4_Out}
        
        - delay 170
        - skill{s=PbWS_Orbit_Shield_4_Return_mmocore}
    ]} @self ?varInRange{var=skill.shieldFound;value=<2} ?varEquals{var=caster.pbws_shield_4_availability;value=1}
  
  # Try Shield 2
  - skill{s=[
        - variableadd{var=skill.shieldFound;amount=1} @caster
        - skill{s=PbWS_Orbit_Shield_2_Out}
        
        - delay 170
        - skill{s=PbWS_Orbit_Shield_2_Return_mmocore}
    ]} @self ?varInRange{var=skill.shieldFound;value=<2} ?varEquals{var=caster.pbws_shield_2_availability;value=1}
  
  # Try Shield 3
  - skill{s=[
        - variableadd{var=skill.shieldFound;amount=1} @caster
        - skill{s=PbWS_Orbit_Shield_3_Out}
        
        - delay 170
        - skill{s=PbWS_Orbit_Shield_3_Return_mmocore}
    ]} @self ?varInRange{var=skill.shieldFound;value=<2} ?varEquals{var=caster.pbws_shield_3_availability;value=1}
  
  - setvariable{var=skill.casted;value=0} @caster
  - summon{t=PbWS_VFX_Singularity;r=0;yr=0;os=true;
        onSummon=[
          - setvariable{var=skill.casted;value=1} @caster
          - solo_velocity{m=set;x=0;y=-999;z=0}
         
          - delay 19
          - SudoSkill{s=PbWS_Singularity_mmocore-ARRIVAL;setcasterastrigger=true}
        ]
    } @Target{ignore=armorstands;conditions=[  - solo_can_target{interaction=OFFENSE_ACTION}  ]}
    
  - summon{t=PbWS_VFX_Singularity;r=0;yr=0;os=true;
        onSummon=[
          - solo_velocity{m=set;x=0;y=-999;z=0}
      
          - delay 19
          - SudoSkill{s=PbWS_Singularity_mmocore-ARRIVAL;setcasterastrigger=true}
        ]
    } @TargetLocation{d=15;ignoreTransparent=true} ?varEquals{var=skill.casted;value=0}
  
  - delay 20
  - Aura{auraName=pbws_singularity_active_test;duration=150;i=20;
        onTick=[
          - totem{oS=PbWS_Singularity_mmocore-TICK} @Children{target=armorstands;conditions=[  - mythicmobtype{t=PbWS_VFX_Singularity} ]}
        ]
    } @self


PbWS_Singularity_mmocore-TICK:
  Skills:
  - solo_damage{a="<skill.var.damage>";pkb=true;pi=true} @ENO{r=8.5;ignore=armorstands;ignore=players}
  - solo_damage{a="<skill.var.damage>";pkb=true;pi=true} @ENO{r=8.5;ignore=armorstands;target=players}
  - solo_pull{v=3;to=true} @ENO{r=6.5;ignore=armorstands;conditions=[ - solo_is_my_summon false ]}
  
  - potion{type=SLOW;duration=40;level=3} @ENO{r=8.5;ignore=armorstands;conditions=[  - haspotioneffect{type=SLOW;level=>1} ]}
  - potion{type=SLOW;duration=40;level=2} @ENO{r=8.5;ignore=armorstands;conditions=[  - haspotioneffect{type=SLOW;level=1} ]}
  - potion{type=SLOW;duration=40;level=1} @ENO{r=8.5;ignore=armorstands;conditions=[  - haspotioneffect{type=SLOW} false ]}

PbWS_Singularity_mmocore-ARRIVAL:
  Skills:
  - solo_pull{velocity=7} @EIR{r=8;targetself=false;targetowner=false;ignore=armorstands;conditions=[ - solo_is_my_summon false ]}

