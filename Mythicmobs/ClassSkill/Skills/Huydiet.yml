#===========================================================================skill2==================================================================================#
## Ultimate Ability: Awakening (Shift + RMB)
PbWS_Awakening_mmocore:
  
  Skills:
  - skill{s=PbWS_Oribt_Shield_All_Out}
  
  - setvariable{var=skill.casted;value=0} @caster
  - summon{t=PbWS_VFX_Shield_Ult_Charging;r=0;yr=0;os=true;
        onSummon=[
          - setvariable{var=skill.casted;value=1} @caster
          - solo_velocity{m=set;x=0;y=-999;z=0}
        ]
    } @Target{ignore=armorstands;conditions=[  - solo_can_target{interaction=OFFENSE_ACTION}  ]}
    
  - summon{t=PbWS_VFX_Shield_Ult_Charging;r=0;yr=0;os=true;
        onSummon=[
          - solo_velocity{m=set;x=0;y=-999;z=0}
        ]
    } @TargetLocation{d=15;ignoreTransparent=true} ?varEquals{var=skill.casted;value=0}
    
  - totem{oS=PbWS_Awakening_mmocore_Charging-TICK;repeat=33;repeatInterval=5;delay=25} @Children{target=armorstands;conditions=[  - mythicmobtype{t=PbWS_VFX_Shield_Ult_Charging} ]}
  
  - delay 90
  - skill{s=[
      - summon{t=PbWS_VFX_Shield_Ult_Unleashed}
      - remove
    ]} @Children{target=armorstands;conditions=[  - mythicmobtype{t=PbWS_VFX_Shield_Ult_Charging} ]}
  
  - totem{oS=PbWS_Awakening_mmocore_Unleashed-TICK;repeat=33;repeatInterval=5;delay=5} @Children{target=armorstands;conditions=[  - mythicmobtype{t=PbWS_VFX_Shield_Ult_Unleashed} ]}
  - totem{oS=PbWS_Awakening_mmocore_Unleashed_Launch_Shield;repeat=8;repeatInterval=20} @Children{target=armorstands;conditions=[  - mythicmobtype{t=PbWS_VFX_Shield_Ult_Unleashed} ]}
  - sound{s=block.conduit.deactivate;p=0.7;v=0.65;repeat=7;repeatInterval=20;delay=11} @self
  
  - delay 180
  - skill{s=PbWS_Oribt_Shield_All_Return_mmocore}

PbWS_Awakening_mmocore_Charging-TICK:
  Skills:
  - solo_pull{v=2.5;to=true} @ENO{r=13;ignore=armorstands;conditions=[ - solo_is_my_summon false ]}

PbWS_Awakening_mmocore_Unleashed-TICK:
  Skills:
  - potion{type=SLOW;duration=10;level=3} @ENO{r=13;ignore=armorstands;conditions=[ - solo_is_my_summon false ]}

PbWS_Awakening_mmocore_Unleashed_Launch_Shield:
  Skills:
  - summon{t=PbWS_VFX_Perihelion;r=0;yr=0;os=true;
        onSummon=[
          - solo_velocity{m=set;x=0;y=-999;z=0}
          - delay 15
          - totem{oS=PbWS_Perihelion_mmocore_DAMAGE_NO_KNOCKBACK}
          - delay 20
          - remove
        ]
    } @ENO{r=13;ignore=armorstands;limit=2;sort=RANDOM}

PbWS_Perihelion_mmocore_DAMAGE_NO_KNOCKBACK:
  Skills:
  - solo_damage{a="<skill.var.damage>";pkb=true;pi=true} @ENO{r=6;ignore=armorstands;ignore=players}
  - solo_damage{a="<skill.var.damage>";pkb=true;pi=true} @ENO{r=6;ignore=armorstands;target=players}
