warrior_whirlwind_skill:
  Skills:
  - Aura{auraName=warrior_whirlwind_duration;duration=80} @self
  - orbital{auraName=vfx_warrior_whirlwind;bulletType=MOB;mob=vfx_warrior_whirlwind;hr=1;vr=1;hp=false;hnp=false;r=0;duration=80;oy=1;rx=0;ry=0;rz=0;avx=0;avy=0;avz=0} @self
  - sound{s=entity.player.attack.sweep;repeat=1;repeati=40} @self
  - particles{p=dust_color_transition;color1=#ffa31a;color2=#ff6714;amount=25;hS=0.4;vS=0.1;y=0.1;size=0.75;speed=0;repeat=20;repeati=5} @self
  - particlering{p=dust_color_transition;color1=#ffa31a;color2=#ff6714;radius=1;points=30;amount=1;hS=0;vS=0;y=0.1;size=0.8;repeat=7;repeati=10} @self
  - particlering{p=dust_color_transition;color1=#ffa31a;color2=#ff6714;radius=3;points=60;amount=1;hS=0;vS=0;y=0.1;size=1.5;repeat=7;repeati=10} @self
  - particlering{p=dust_color_transition;color1=#f3e2b6;color2=#ebc78f;radius=5;points=60;amount=1;hS=0;vS=0;y=0.1;size=1.5;repeat=7;repeati=10} @self

  # scale model x1.3 -> r 5 -> 6.5
  - solo_damage{a="<skill.var.damage>";pkb=true;hnp=true;hp=true;repeat=7;repeati=10} @EIR{r=6.5;ignore=players}
  - solo_damage{a="<skill.var.damage>";pkb=true;hnp=true;hp=true;repeat=7;repeati=10} @EIR{r=6.5;target=players}

  - solo_pull{v=5;repeat=40;repeati=2} @EIRR{min=3;max=5;conditions=[ - solo_is_my_summon false ]}

