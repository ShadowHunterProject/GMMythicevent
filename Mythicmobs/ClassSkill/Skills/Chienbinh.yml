#----------------------------------------------Noitai----------------------------------------------------------------#
warrior_rage:
  Skills:
  - sound{s=entity.ravager.roar} @self
  - potion{type=DAMAGE_RESISTANCE;duration=160;level=1;hasParticles=false} @self
  - potion{type=SPEED;duration=160;level=1;hasParticles=false} @self
  - particles{p=dust_color_transition;color1=#ff952e;color2=#ff3700;amount=1;hS=0.3;vS=0.3;y=0.4;size=0.75;speed=0;repeat=60;repeati=1} @self
  - summon{type=vfx_warrior_rage_dust;amount=1;radius=0;yRadius=0;onSurface=false} @selflocation
  - orbital{auraName=vfx_warrior_rage;bulletType=MOB;mob=vfx_warrior_rage;hr=1;vr=1;hp=false;hnp=false;r=0;duration=20;oy=1;rx=0;ry=0;rz=0;avx=0;avy=0;avz=0} @self
  - solo_throw{velocity=15;velocityY=2} @EIR{r=5;conditions=[ - solo_is_my_summon false ]}
  - skill{s=warrior_shockwave_effect_small} @self

