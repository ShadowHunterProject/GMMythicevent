#--------------------------------------------skill 3------------------------------------------------------------#
warrior_hellblade:
  Skills:
  - sound{s=entity.ender_dragon.growl} @self
  - delay 8
  - sound{s=block.lava.pop} @self
  - Aura{auraName=warrior_hellblade_duration;duration=80} @self
  - particles{p=dust_color_transition;color1=#ffa31a;color2=#ff6714;amount=3;hS=0.4;vS=0.1;y=0.1;size=0.75;speed=0;repeat=10;repeati=1} @self
  - potion{type=SLOW;duration=80;level=2;hasParticles=false} @EIR{r=4;conditions=[ - solo_is_my_summon false ]}
  - summon{type=vfx_warrior_hellblade;amount=1;radius=0;yRadius=0;onSurface=false} @selflocation
  - delay 3
  - particle{p=lava} @self
  - skill{s=warrior_lava_effect;repeat=7;repeati=10} @selflocation
  - skill{s=warrior_cloud_effect;repeat=7;repeati=10} @selflocation
  - skill{s=warrior_hellblade_damage;repeat=4;repeati=19} @selflocation

warrior_hellblade_damage:
  TargetConditions:
  - solo_is_my_summon false
  - entitytype{t=ARMOR_STAND} false
  Skills:
  # scale model x1.3 -> r 5 -> 6.5
  - solo_damage{a="<skill.var.damage>";pkb=false;hnp=true;hp=true;delay=1} @EntitiesNearOrigin{r=6.5;ignore=players}
  - solo_damage{a="<skill.var.damage>";pkb=false;hnp=true;hp=true;delay=1} @EntitiesNearOrigin{r=6.5;target=players}

Knockback_Prevent_CAST:
  Skills:
  - onDamaged{auraName=shield_block;oH=Knockback_Prevent_BLOCK;cE=true;d=<skill.duration> * 5} @self

